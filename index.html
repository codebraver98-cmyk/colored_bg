<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>click the buttons to change the background color!</h1>
    <button id="red">Red</button>
    <button id="blue">Blue</button>
    <button id="green">Green</button>
    <button id="reset">RESET</button>
    <script>
        window.addEventListener("click",function() { 
    document.getElementById('red').style.backgroundColor='red';
})
window.addEventListener("click",function() {
    document.getElementById('blue').style.backgroundColor='blue';
})
window.addEventListener("click",function() {
    document.getElementById('green').style.backgroundColor='green';
})

window.addEventListener("click",function() {
    document.getElementById('red').style.backgroundColor='whitesmoke';
    document.getElementById('green').style.backgroundColor='whitesmoke';
    document.getElementById('blue').style.backgroundColor='whitesmoke';
})
    </script>
</body>
</html>
